<div class="w-full h-full flex flex-col gap-4">
    <div class="app-area  h-full p-4">
        <form class="w-full h-full flex flex-col justify-center items-center gap-2" [formGroup]="form" (ngSubmit)="onSubmit()">
            <label>
                ID of the chat to join :
                <input
                    class="app-input  px-2 py-1"
                    type="text"
                    placeholder="Chat ID"
                    formControlName="chatId"
                />
            </label>
            @if (form.controls.chatId.invalid && (form.controls.chatId.dirty || form.controls.chatId.touched))
            {
                @if (form.controls.chatId.hasError('required'))
                {
                    <div class="ml-1 text-sm text-red-500">Chat ID is required.</div>
                }
            }
            @if (errlogs.messages$ | async; as errorMessage)
            {
                <div class="mt-1 text-sm text-red-500">{{ errorMessage }}</div>
            }

            <input class="app-button  px-2 py-1" type="submit" value="Join" />
        </form>
    </div>
</div>
