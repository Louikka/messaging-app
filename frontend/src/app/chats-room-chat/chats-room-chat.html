<div class="w-full h-full flex flex-col gap-4">
    <!-- display -->
    <div class="app-area scrollable  h-full py-4 px-1">
        @for (message of messages.messages$ | async; track message)
        {
            @if (message.type === 'message')
            {
                <div class="log-message">{{ message.username }}: {{ message.text }}</div>
            }
            @else if (message.type === 'error')
            {
                <div class="log-error font-mono">{{ message.text }}</div>
            }
        }
    </div>

    <!-- input -->
    <div class="app-area  p-2">
        <form class="flex gap-2 items-center-safe" [formGroup]="form" (ngSubmit)="onMessageSubmit()">
            <input
                class="app-input  w-full px-3 py-1 text-lg"
                type="text"
                placeholder="Type here"
                formControlName="text"
            />
            <input class="app-button  px-3 py-1 text-lg" type="submit" value="Send" />
        </form>
    </div>
</div>
