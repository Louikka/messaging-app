<div class="w-full h-full p-4 flex gap-4">
    <aside class="app-tile  max-w-70 w-1/5 p-4 flex flex-col">
        <!-- chat controls buttons -->
        <div class="mt-4 flex flex-col gap-2 text-lg text-(--app-button-text-color)">
            <input
                class="app-button  py-1"
                type="button"
                value="Create new chat"
                (click)="navigateToCreateChat()"
            />
            <input
                class="app-button  py-1"
                type="button"
                value="Join chat"
                (click)="navigateToJoinChat()"
            />
        </div>

        <!-- chats list -->
        <div class="mt-4 flex flex-col gap-2">
            @for (chat of chats.chats$ | async; track chat)
            {
                <button class="px-3 rounded-xl hover:bg-neutral-950/10" (click)="navigateToChat(chat.id)">
                    Chat "{{ chat.name }}"
                </button>
            }
        </div>
    </aside>

    <main class="w-full">
        <router-outlet />
    </main>
</div>
